services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://trusttrace:trusttrace_pw@db:5432/trusttrace
      - DEMO_MODE=true
      - AI_PROVIDER=demo
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: trusttrace
      POSTGRES_PASSWORD: trusttrace_pw
      POSTGRES_DB: trusttrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trusttrace"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
