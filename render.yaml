services:
  - type: web
    name: trusttrace-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: "demo"
      - key: SECRET_KEY
        value: "trusttrace-production-secure-key-32chars-minimum-token"
      - key: DATABASE_URL
        sync: false
